name: Update poe.ninja data

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Fetch Fragments
        run: |
          curl -s "https://poe.ninja/api/data/currencyoverview?league=Mercenaries&type=Fragment" \
          -o db/fragments.json

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add db/fragments.json
          git commit -m "Update fragments cache" || echo "No changes"
          git push
